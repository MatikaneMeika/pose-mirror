name: build-windows-exe

# Builds a single-file Windows executable with PyInstaller and attaches it
# to a GitHub Release. Triggered by pushing a tag like `v0.1.0`, or manually
# from the Actions tab (workflow_dispatch).
#
# The exe is fully offline after the first run: on first launch it downloads
# the MediaPipe pose model (~9 MB) next to the exe, then never needs the
# network again.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyinstaller-hooks-contrib

      - name: Build exe with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name pose-mirror
          --paths src
          --add-data "web;web"
          --collect-all mediapipe
          main.py

      - name: Smoke test (no camera needed)
        run: |
          dist\pose-mirror.exe --help

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: pose-mirror-windows
          path: dist/pose-mirror.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pose-mirror.exe
          generate_release_notes: true
